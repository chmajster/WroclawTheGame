name: Bootstrap OpenGameArt CC0 story props

on:
  push:
    branches:
      - assets/cc0-models-20260918
    paths:
      - .github/workflows/bootstrap-oga-story-props.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch audited CC0 story props and commit each model separately
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import hashlib, html, json, os, re, shutil, subprocess, tempfile, urllib.request, zipfile
          from pathlib import Path, PurePosixPath
          from urllib.parse import urljoin, urlparse

          ROOT=Path.cwd()
          UA="WroclawTheGame-OGA-CC0-Fetcher/1.0"
          ALLOWED_HOST={"opengameart.org","www.opengameart.org"}
          ALLOWED_EXT={".fbx",".obj",".mtl",".png",".jpg",".jpeg",".gltf",".glb",".txt"}
          MAX_DOWNLOAD=25*1024*1024
          MAX_MEMBER=40*1024*1024

          SPECS=[
            {
              "id":"oga-smartphone-redacted",
              "page":"https://opengameart.org/content/smartphone-1",
              "title":"Smartphone",
              "use":"Phone pickup, abandoned phone and phone-related clue prop.",
              "mode":"files",
              "need":["samsung-sgh-i677.obj","samsung-sgh-i677-redacted.png"],
              "primary":"samsung-sgh-i677.obj"
            },
            {
              "id":"oga-key-low-poly",
              "page":"https://opengameart.org/content/key-low-poly",
              "title":"Key - low poly",
              "use":"Apartment, basement, shop and garage key pickup proxy.",
              "mode":"zip",
              "file_hint":"key",
              "select":"key"
            },
            {
              "id":"oga-first-aid-kit",
              "page":"https://opengameart.org/content/first-aid-kit-3d",
              "title":"First Aid Kit 3D",
              "use":"Medkit / dressing consumable world model.",
              "mode":"zip",
              "file_hint":"first_aid",
              "select":"first"
            },
            {
              "id":"oga-survival-battery",
              "page":"https://opengameart.org/content/lowpoly-survival-item-pack",
              "title":"Lowpoly survival item pack — battery",
              "use":"Battery pickup required by the flashlight gameplay step.",
              "mode":"zip",
              "file_hint":"survival",
              "select":"battery"
            },
            {
              "id":"oga-keycard",
              "page":"https://opengameart.org/content/3d-keycard",
              "title":"3D Keycard",
              "use":"Generic electronic key/card/remote proxy for secure access interactions.",
              "mode":"zip",
              "file_hint":"keycard",
              "select":"keycard"
            }
          ]

          def get(url,binary=False):
              p=urlparse(url)
              if p.scheme!="https" or p.hostname not in ALLOWED_HOST:
                  raise ValueError(f"Unexpected host: {url}")
              req=urllib.request.Request(url,headers={"User-Agent":UA})
              with urllib.request.urlopen(req,timeout=120) as r:
                  if r.status!=200: raise RuntimeError(f"HTTP {r.status}: {url}")
                  if binary:
                      data=r.read(MAX_DOWNLOAD+1)
                      if len(data)>MAX_DOWNLOAD: raise ValueError(f"Download too large: {url}")
                      return data
                  return r.read().decode("utf-8","replace")

          def links(page):
              body=get(page)
              found=[]
              for raw in re.findall(r'href=["\']([^"\']+)["\']',body,re.I):
                  url=urljoin(page,html.unescape(raw))
                  p=urlparse(url)
                  if p.scheme=="https" and p.hostname in ALLOWED_HOST and "/sites/default/files/" in p.path:
                      found.append(url)
              return list(dict.fromkeys(found))

          def safe_zip_extract(data,dest):
              if not data.startswith(b"PK"): raise ValueError("Expected ZIP")
              zp=dest/"source.zip"; zp.write_bytes(data)
              out=dest/"unpacked"; out.mkdir()
              with zipfile.ZipFile(zp) as z:
                  total=0
                  for info in z.infolist():
                      pp=PurePosixPath(info.filename)
                      if pp.is_absolute() or ".." in pp.parts: raise ValueError("Unsafe ZIP path")
                      if info.is_dir(): continue
                      if info.file_size>MAX_MEMBER: raise ValueError("ZIP member too large")
                      total+=info.file_size
                      if total>100*1024*1024: raise ValueError("Expanded ZIP too large")
                      ext=Path(info.filename).suffix.lower()
                      if ext not in ALLOWED_EXT: continue
                      target=out/Path(*pp.parts); target.parent.mkdir(parents=True,exist_ok=True)
                      with z.open(info) as s, open(target,"wb") as d: shutil.copyfileobj(s,d)
              return out

          def choose_model(paths,keyword):
              models=[p for p in paths if p.suffix.lower() in {".fbx",".obj",".gltf",".glb"}]
              if not models: raise ValueError("No importable model in archive")
              preferred=[p for p in models if keyword.lower() in p.stem.lower()]
              pool=preferred or models
              rank={".fbx":0,".glb":1,".gltf":2,".obj":3}
              return sorted(pool,key=lambda p:(rank.get(p.suffix.lower(),9),len(p.as_posix())))[0]

          catalog_path=ROOT/"Data/free_external_model_catalog.json"
          catalog=json.loads(catalog_path.read_text(encoding="utf-8")) if catalog_path.exists() else []
          existing={x["id"] for x in catalog}
          failures=[]
          for spec in SPECS:
              if spec["id"] in existing: continue
              work=Path(tempfile.mkdtemp(prefix="wtg-oga-"))
              try:
                  page_links=links(spec["page"])
                  target=ROOT/"SourceAssets/Models/OpenGameArt"/spec["id"]
                  target.mkdir(parents=True,exist_ok=True)
                  source_records=[]
                  primary=None
                  if spec["mode"]=="files":
                      for wanted in spec["need"]:
                          matches=[u for u in page_links if Path(urlparse(u).path).name.lower()==wanted.lower()]
                          if not matches: raise ValueError(f"Missing source link {wanted}")
                          url=matches[0]; data=get(url,True); name=Path(urlparse(url).path).name
                          out=target/name; out.write_bytes(data)
                          source_records.append({"file":name,"url":url,"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()})
                          if name.lower()==spec["primary"].lower(): primary=out
                  else:
                      zips=[u for u in page_links if urlparse(u).path.lower().endswith(".zip")]
                      hinted=[u for u in zips if spec["file_hint"].lower() in Path(urlparse(u).path).name.lower()]
                      if not (hinted or zips): raise ValueError("No ZIP source link found")
                      url=(hinted or zips)[0]; data=get(url,True)
                      unpack=safe_zip_extract(data,work)
                      files=[p for p in unpack.rglob("*") if p.is_file()]
                      selected=choose_model(files,spec["select"])
                      # Keep selected model plus material/texture sidecars; small archives are copied in full for reproducibility.
                      for p in files:
                          rel=p.relative_to(unpack)
                          out=target/rel; out.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(p,out)
                      primary=target/selected.relative_to(unpack)
                      source_records.append({"archive_url":url,"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()})
                  if not primary or not primary.exists(): raise ValueError("Primary model missing")
                  rec={
                    "id":spec["id"],"name":spec["title"],"provider":"OpenGameArt",
                    "source_page":spec["page"],"license":"CC0-1.0","intended_use":spec["use"],
                    "primary_path":primary.relative_to(ROOT).as_posix(),"sources":source_records
                  }
                  (target/"asset.json").write_text(json.dumps(rec,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
                  catalog.append(rec); catalog_path.write_text(json.dumps(catalog,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
                  subprocess.run(["git","add",str(target.relative_to(ROOT)),str(catalog_path.relative_to(ROOT))],check=True)
                  subprocess.run(["git","commit","-m",f"assets: add {spec['id']} CC0 model"],check=True)
                  subprocess.run(["git","push","origin",f"HEAD:{os.environ['GITHUB_REF_NAME']}"],check=True)
                  existing.add(spec["id"])
              except Exception as e:
                  failures.append({"id":spec["id"],"source_page":spec["page"],"error":str(e)})
                  print(f"::warning title=OGA asset skipped::{spec['id']}: {e}")
                  subprocess.run(["git","reset","--hard","HEAD"],check=True)
                  subprocess.run(["git","clean","-fd","SourceAssets/Models/OpenGameArt"],check=True)
              finally:
                  shutil.rmtree(work,ignore_errors=True)
          fp=ROOT/"Data/free_external_model_failures.json"
          fp.write_text(json.dumps(failures,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          subprocess.run(["git","add",str(fp.relative_to(ROOT))],check=True)
          if subprocess.run(["git","diff","--cached","--quiet"]).returncode!=0:
              subprocess.run(["git","commit","-m","chore: record unresolved external model sources"],check=True)
              subprocess.run(["git","push","origin",f"HEAD:{os.environ['GITHUB_REF_NAME']}"],check=True)
          PY
