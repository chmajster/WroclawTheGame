name: Bootstrap audited CC0 model wave 4

on:
  push:
    branches:
      - assets/cc0-models-20260918
    paths:
      - .github/workflows/bootstrap-cc0-models-wave4.yml

permissions:
  contents: write

jobs:
  fetch-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch targeted Poly Haven models and commit each separately
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import hashlib,json,os,subprocess,time,urllib.request
          from pathlib import Path,PurePosixPath
          from urllib.parse import urlparse
          ROOT=Path.cwd(); API="https://api.polyhaven.com"; UA="WroclawTheGame-CC0-ModelFetcher/4.0"
          MAX_FILE=95*1024*1024; MAX_ASSET=240*1024*1024
          ASSETS=[
            ("can_rusted","Can Rusted","Can pickup/distraction and street/garage clutter."),
            ("clipboard","Clipboard","Notes, schedules, plans and paper clue proxy."),
            ("CashRegister_01","Cash Register 01","Shop cash register / terminal scene prop."),
            ("metal_jerrycan","Metal Jerrycan","Garage/workshop fuel and industrial clutter."),
            ("rusted_wheel_rim_01","Rusted Wheel Rim 01","Garage/workshop automotive detail."),
            ("spray_paint_bottles","Spray Paint Bottles","Garage/workshop and graffiti-related prop."),
            ("plastic_broom","Plastic Broom","Apartment/shop/workshop utility prop."),
            ("small_oil_can","Small Oil Can","Garage/workshop automotive tool prop.")
          ]
          def req(url,b=False):
              q=urllib.request.Request(url,headers={"User-Agent":UA}); last=None
              for a in range(3):
                  try:
                      with urllib.request.urlopen(q,timeout=120) as r:
                          if r.status!=200: raise RuntimeError(f"HTTP {r.status}")
                          return r.read() if b else json.load(r)
                  except Exception as e:
                      last=e
                      if a<2: time.sleep(2**a)
              raise RuntimeError(f"fetch {url}: {last}")
          def guard(url,api=False):
              p=urlparse(url); allowed={"api.polyhaven.com"} if api else {"dl.polyhaven.org"}
              if p.scheme!="https" or p.hostname not in allowed: raise ValueError(f"unexpected URL {url}")
          def safe(s):
              p=PurePosixPath(s)
              if p.is_absolute() or ".." in p.parts or not p.parts: raise ValueError(f"unsafe path {s}")
              return Path(*p.parts)
          def put(e,dst):
              url=e.get("url"); md5=e.get("md5"); size=int(e.get("size") or 0)
              if not url or not md5: raise ValueError("incomplete metadata")
              guard(url)
              if size and size>MAX_FILE: raise ValueError(f"file too large {size}")
              data=req(url,True)
              if len(data)>MAX_FILE: raise ValueError("download too large")
              got=hashlib.md5(data).hexdigest()
              if got.lower()!=md5.lower(): raise ValueError("md5 mismatch")
              dst.parent.mkdir(parents=True,exist_ok=True); dst.write_bytes(data)
              return {"path":dst.relative_to(ROOT).as_posix(),"bytes":len(data),"md5":got,
                      "sha256":hashlib.sha256(data).hexdigest(),"source_url":url}
          cp=ROOT/"Data/free_model_catalog.json"; cat=json.loads(cp.read_text(encoding="utf-8")); existing={x["slug"] for x in cat}
          failures=[]
          for slug,name,use in ASSETS:
              if slug in existing: continue
              try:
                  iu=f"{API}/info/{slug}"; fu=f"{API}/files/{slug}"; guard(iu,True); guard(fu,True)
                  info=req(iu); files=req(fu)
                  if int(info.get("type",-1))!=2: raise ValueError("not a model")
                  block=files.get("fbx",{}).get("1k",{}).get("fbx",{})
                  if not block.get("url"): raise ValueError("missing 1k FBX")
                  target=ROOT/"SourceAssets/Models/PolyHaven"/slug; dl=[]
                  url=block["url"]; guard(url); main=Path(urlparse(url).path).name
                  dl.append(put(block,target/main))
                  for inc,e in sorted((block.get("include") or {}).items()): dl.append(put(e,target/safe(inc)))
                  if sum(x["bytes"] for x in dl)>MAX_ASSET: raise ValueError("bundle too large")
                  rec={"slug":slug,"name":info.get("name") or name,"intended_use":use,
                       "source_page":f"https://polyhaven.com/a/{slug}","provider":"Poly Haven","license":"CC0-1.0",
                       "license_url":"https://polyhaven.com/license","authors":info.get("authors",{}),
                       "category":info.get("category"),"tags":info.get("tags",[]),"dimensions_mm":info.get("dimensions"),
                       "files_hash":info.get("files_hash"),"format":"fbx","resolution":"1k",
                       "primary_path":(target/main).relative_to(ROOT).as_posix(),"files":dl}
                  (target/"asset.json").write_text(json.dumps(rec,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
                  cat.append({k:rec[k] for k in ("slug","name","intended_use","source_page","provider","license","license_url",
                                                  "authors","category","dimensions_mm","files_hash","format","resolution","primary_path")})
                  cp.write_text(json.dumps(cat,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
                  subprocess.run(["git","add",str(target.relative_to(ROOT)),str(cp.relative_to(ROOT))],check=True)
                  subprocess.run(["git","commit","-m",f"assets: add {slug} CC0 model"],check=True)
                  subprocess.run(["git","push","origin",f"HEAD:{os.environ['GITHUB_REF_NAME']}"],check=True)
                  existing.add(slug)
              except Exception as e:
                  failures.append({"slug":slug,"error":str(e)})
                  print(f"::warning title=CC0 model skipped::{slug}: {e}")
                  subprocess.run(["git","reset","--hard","HEAD"],check=True)
                  subprocess.run(["git","clean","-fd","SourceAssets/Models/PolyHaven"],check=True)
          fp=ROOT/"Data/free_model_wave4_failures.json"; fp.write_text(json.dumps(failures,indent=2,ensure_ascii=False)+"\n")
          subprocess.run(["git","add",str(fp.relative_to(ROOT))],check=True)
          if subprocess.run(["git","diff","--cached","--quiet"]).returncode!=0:
              subprocess.run(["git","commit","-m","chore: record CC0 model wave 4 results"],check=True)
              subprocess.run(["git","push","origin",f"HEAD:{os.environ['GITHUB_REF_NAME']}"],check=True)
          PY
