name: Materialize KayKit animation completion

on:
  push:
    branches:
      - assets/kaykit-animation-completion-20260918
    paths:
      - Scripts/fetch_kaykit_character_animations.py
      - .github/workflows/materialize-kaykit-animation-completion.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: assets/kaykit-animation-completion-20260918
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned KayKit CC0 assets
        run: python Scripts/fetch_kaykit_character_animations.py
      - name: Verify source bytes and catalogs
        run: |
          python Scripts/fetch_kaykit_character_animations.py --check
          python -m unittest Tests.test_kaykit_character_animations -v
          python -m compileall -q Scripts
      - name: Commit materialized assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SourceAssets/Animations/KayKit/CharacterAnimations1_1
          git add Data/free_kaykit_animation_catalog.json
          git rm -- .github/workflows/materialize-kaykit-animation-completion.yml
          if git diff --cached --quiet; then
            echo "No asset changes to commit"
            exit 0
          fi
          git commit -m "assets: materialize KayKit Rig_Medium CC0 animations"
          git push origin "HEAD:${GITHUB_REF_NAME}"
