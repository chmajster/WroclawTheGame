name: Logic and source assets
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r Scripts/gis/requirements.txt
      - name: Run production progression model and asset tests
        run: bash Scripts/test.sh
