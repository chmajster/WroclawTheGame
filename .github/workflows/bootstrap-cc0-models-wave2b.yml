name: Bootstrap audited CC0 model wave 2b

on:
  push:
    branches:
      - assets/cc0-models-20260918
    paths:
      - .github/workflows/bootstrap-cc0-models-wave2b.yml

permissions:
  contents: write

jobs:
  fetch-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch remaining Poly Haven models without stopping the batch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import hashlib,json,os,subprocess,time,urllib.request,traceback
          from pathlib import Path,PurePosixPath
          from urllib.parse import urlparse
          ROOT=Path.cwd(); API="https://api.polyhaven.com"; UA="WroclawTheGame-CC0-ModelFetcher/2.1"
          MAX_FILE=95*1024*1024; MAX_ASSET=220*1024*1024
          ASSETS=[
            ("power_box_01","Power Box 01","Fuse box, electrical panel and camera power-control interactions."),
            ("classic_laptop","Classic Laptop","Apartment computer and terminal interaction prop."),
            ("cardboard_box_01","Cardboard Box 01","Package, shop backroom and garage clutter."),
            ("plastic_container","Plastic Container","Courtyard hiding/storage container."),
            ("wooden_bookshelf_worn","Wooden Bookshelf Worn","Garage hiding shelf and basement/workshop storage."),
            ("drawer_cabinet","Drawer Cabinet","Apartment drawer/cabinet furniture for phone and clue interactions."),
            ("GothicBed_01","Gothic Bed 01","Bed proxy for the opening apartment scene."),
            ("electric_stove","Electric Stove","Kitchen appliance for the apartment kitchen."),
            ("modular_street_seating","Modular Street Seating","Street/park bench for clue placement and city dressing."),
            ("covered_car","Covered Car","Static parked/garage car prop; not used as the driveable vehicle."),
            ("old_tyre","Old Tyre","Garage/workshop automotive clutter."),
            ("korean_fire_extinguisher_01","Korean Fire Extinguisher 01","Building, basement and garage fire-safety prop."),
            ("metal_trash_can","Metal Trash Can","Courtyard/street trash prop."),
            ("trashbag","Trashbag","Street/alley/courtyard clutter."),
            ("plastic_crate_01","Plastic Crate 01","Shop, garage and workshop storage prop."),
            ("decorative_book_set_01","Decorative Book Set 01","Apartment book clue and shelf dressing."),
            ("rollershutter_window_01","Rollershutter Window 01","Shop/garage shutter and industrial frontage."),
            ("wooden_display_shelves_01","Wooden Display Shelves 01","Shop/apartment shelving."),
            ("metal_toolbox","Metal Toolbox","Workshop/garage tool storage."),
            ("metal_tool_chest","Metal Tool Chest","Garage/workshop tool chest."),
            ("stone_01","Stone 01","Throwable stone pickup."),
            ("wooden_crate_01","Wooden Crate 01","Shop/garage storage and cover prop."),
            ("fire_hydrant","Fire Hydrant","Urban street infrastructure dressing."),
            ("utility_box_01","Utility Box 01","Urban electrical infrastructure and clue dressing.")
          ]
          def req(url,b=False):
              q=urllib.request.Request(url,headers={"User-Agent":UA}); last=None
              for a in range(3):
                  try:
                      with urllib.request.urlopen(q,timeout=120) as r:
                          if r.status!=200: raise RuntimeError(f"HTTP {r.status}")
                          return r.read() if b else json.load(r)
                  except Exception as e:
                      last=e
                      if a<2: time.sleep(2**a)
              raise RuntimeError(f"fetch {url}: {last}")
          def guard(url,api=False):
              p=urlparse(url); allowed={"api.polyhaven.com"} if api else {"dl.polyhaven.org"}
              if p.scheme!="https" or p.hostname not in allowed: raise ValueError(f"Unexpected URL {url}")
          def relsafe(s):
              p=PurePosixPath(s)
              if p.is_absolute() or ".." in p.parts or not p.parts: raise ValueError(f"Unsafe path {s}")
              return Path(*p.parts)
          def put(entry,dst):
              url=entry.get("url"); md5=entry.get("md5"); size=int(entry.get("size") or 0)
              if not url or not md5: raise ValueError(f"Incomplete metadata {dst}")
              guard(url)
              if size and size>MAX_FILE: raise ValueError(f"file metadata too large {size}")
              data=req(url,True)
              if len(data)>MAX_FILE: raise ValueError(f"file download too large {len(data)}")
              got=hashlib.md5(data).hexdigest()
              if got.lower()!=md5.lower(): raise ValueError(f"MD5 mismatch {dst}")
              dst.parent.mkdir(parents=True,exist_ok=True); dst.write_bytes(data)
              return {"path":dst.relative_to(ROOT).as_posix(),"bytes":len(data),"md5":got,
                      "sha256":hashlib.sha256(data).hexdigest(),"source_url":url}
          catp=ROOT/"Data/free_model_catalog.json"; cat=json.loads(catp.read_text(encoding="utf-8")); existing={x["slug"] for x in cat}
          failures=[]
          for slug,name,use in ASSETS:
              if slug in existing: continue
              try:
                  iu=f"{API}/info/{slug}"; fu=f"{API}/files/{slug}"; guard(iu,True); guard(fu,True)
                  info=req(iu); files=req(fu)
                  if int(info.get("type",-1))!=2: raise ValueError("not a model")
                  block=files.get("fbx",{}).get("1k",{}).get("fbx",{})
                  if not block.get("url"): raise ValueError("missing 1k FBX")
                  target=ROOT/"SourceAssets/Models/PolyHaven"/slug; dl=[]
                  url=block["url"]; guard(url); main=Path(urlparse(url).path).name
                  if not main.lower().endswith(".fbx"): raise ValueError("primary is not FBX")
                  dl.append(put(block,target/main))
                  for inc,e in sorted((block.get("include") or {}).items()): dl.append(put(e,target/relsafe(inc)))
                  total=sum(x["bytes"] for x in dl)
                  if total>MAX_ASSET: raise ValueError(f"bundle too large {total}")
                  rec={"slug":slug,"name":info.get("name") or name,"intended_use":use,
                       "source_page":f"https://polyhaven.com/a/{slug}","provider":"Poly Haven","license":"CC0-1.0",
                       "license_url":"https://polyhaven.com/license","authors":info.get("authors",{}),
                       "category":info.get("category"),"tags":info.get("tags",[]),"dimensions_mm":info.get("dimensions"),
                       "files_hash":info.get("files_hash"),"format":"fbx","resolution":"1k",
                       "primary_path":(target/main).relative_to(ROOT).as_posix(),"files":dl}
                  (target/"asset.json").write_text(json.dumps(rec,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
                  cat.append({k:rec[k] for k in ("slug","name","intended_use","source_page","provider","license","license_url",
                                                  "authors","category","dimensions_mm","files_hash","format","resolution","primary_path")})
                  catp.write_text(json.dumps(cat,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
                  docs=["# Darmowe modele 3D — audyt źródeł","",
                        "Źródła w tym katalogu pochodzą z Poly Haven i są publikowane na licencji CC0 1.0.",
                        "Do repozytorium trafia wariant FBX z teksturami 1K oraz lokalny manifest z MD5/SHA-256.",
                        "Importer Scripts/import_free_models.py nie korzysta z sieci; importuje wyłącznie pliki zatwierdzone w repo.","",
                        "| Model | Zastosowanie | Autorzy | Źródło | Licencja |","|---|---|---|---|---|"]
                  for x in cat:
                      authors=", ".join(x.get("authors",{}).keys()) or "Poly Haven"
                      docs.append(f"| {x['name']} | {x['intended_use']} | {authors} | [Poly Haven]({x['source_page']}) | CC0 1.0 |")
                  (ROOT/"docs/FREE_MODEL_ASSETS.md").write_text("\n".join(docs)+"\n",encoding="utf-8")
                  subprocess.run(["git","add",str(target.relative_to(ROOT)),"Data/free_model_catalog.json","docs/FREE_MODEL_ASSETS.md"],check=True)
                  subprocess.run(["git","commit","-m",f"assets: add {slug} CC0 model"],check=True)
                  subprocess.run(["git","push","origin",f"HEAD:{os.environ['GITHUB_REF_NAME']}"],check=True)
                  existing.add(slug)
              except Exception as e:
                  failures.append({"slug":slug,"error":str(e)})
                  print(f"::warning title=CC0 model skipped::{slug}: {e}")
                  subprocess.run(["git","reset","--hard","HEAD"],check=True)
                  subprocess.run(["git","clean","-fd","SourceAssets/Models/PolyHaven"],check=True)
          (ROOT/"Data/free_model_failures.json").write_text(json.dumps(failures,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          subprocess.run(["git","add","Data/free_model_failures.json"],check=True)
          subprocess.run(["git","commit","-m","chore: record unresolved free model sources"],check=True)
          subprocess.run(["git","push","origin",f"HEAD:{os.environ['GITHUB_REF_NAME']}"],check=True)
          PY
