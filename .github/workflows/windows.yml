name: Windows UE5 package
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        type: choice
        options: [Development, Shipping]
        default: Development
permissions:
  contents: read
jobs:
  package:
    runs-on: [self-hosted, Windows, X64, unreal-5.6]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build, generate content, cook and package
        shell: powershell
        env:
          WROCLAW_CONFIGURATION: ${{ inputs.configuration }}
        run: |
          if (-not $env:UE_ROOT) { throw 'Runner must define UE_ROOT pointing to Unreal Engine 5.6' }
          ./Scripts/Build-Windows.ps1 -EngineRoot $env:UE_ROOT -Configuration $env:WROCLAW_CONFIGURATION
      - uses: actions/upload-artifact@v4
        with:
          name: WroclawTheGame-Win64-${{ inputs.configuration }}
          path: Builds/${{ inputs.configuration }}/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Unreal-build-logs
          path: Saved/Logs/
          if-no-files-found: ignore
