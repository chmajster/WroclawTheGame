name: Bootstrap final CC0 story models

on:
  push:
    branches:
      - assets/cc0-models-20260918
    paths:
      - .github/workflows/bootstrap-final-story-models.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add smartphone and vault/safe proxy
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import hashlib, html, json, os, re, shutil, subprocess, tempfile, urllib.request, zipfile
          from pathlib import Path, PurePosixPath
          from urllib.parse import urljoin, urlparse

          ROOT=Path.cwd(); UA="WroclawTheGame-FinalStoryModels/1.0"
          ALLOWED={"opengameart.org","www.opengameart.org"}
          catalog_path=ROOT/"Data/free_external_model_catalog.json"
          catalog=json.loads(catalog_path.read_text(encoding="utf-8")); existing={x["id"] for x in catalog}

          def fetch(url,limit=30*1024*1024):
              p=urlparse(url)
              if p.scheme!="https" or p.hostname not in ALLOWED: raise ValueError(f"unexpected host {url}")
              q=urllib.request.Request(url,headers={"User-Agent":UA})
              with urllib.request.urlopen(q,timeout=120) as r:
                  data=r.read(limit+1)
              if len(data)>limit: raise ValueError("download too large")
              return data

          def commit_asset(rec,target):
              (target/"asset.json").write_text(json.dumps(rec,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
              catalog.append(rec); catalog_path.write_text(json.dumps(catalog,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
              subprocess.run(["git","add",str(target.relative_to(ROOT)),str(catalog_path.relative_to(ROOT))],check=True)
              subprocess.run(["git","commit","-m",f"assets: add {rec['id']} CC0 model"],check=True)
              subprocess.run(["git","push","origin",f"HEAD:{os.environ['GITHUB_REF_NAME']}"],check=True)
              existing.add(rec["id"])

          sid="oga-smartphone-redacted"
          if sid not in existing:
              target=ROOT/"SourceAssets/Models/OpenGameArt"/sid; target.mkdir(parents=True,exist_ok=True)
              obj_url="https://opengameart.org/sites/default/files/samsung-sgh-i677_0.obj"
              tex_url="https://opengameart.org/sites/default/files/samsung-sgh-i677-redacted.png"
              obj=fetch(obj_url); tex=fetch(tex_url)
              (target/"smartphone.obj").write_bytes(obj); (target/"smartphone-redacted.png").write_bytes(tex)
              rec={"id":sid,"name":"Smartphone","provider":"OpenGameArt",
                   "source_page":"https://opengameart.org/content/smartphone-1","license":"CC0-1.0",
                   "intended_use":"Phone pickup, abandoned phone and phone-related clue prop.",
                   "primary_path":(target/"smartphone.obj").relative_to(ROOT).as_posix(),
                   "sources":[
                     {"url":obj_url,"bytes":len(obj),"sha256":hashlib.sha256(obj).hexdigest()},
                     {"url":tex_url,"bytes":len(tex),"sha256":hashlib.sha256(tex).hexdigest()}
                   ]}
              commit_asset(rec,target)

          vid="oga-vault-door"
          if vid not in existing:
              page="https://opengameart.org/content/vault-door"
              body=fetch(page,2*1024*1024).decode("utf-8","replace")
              urls=[]
              for raw in re.findall(r'href=["\']([^"\']+)["\']',body,re.I):
                  u=urljoin(page,html.unescape(raw))
                  p=urlparse(u)
                  if p.scheme=="https" and p.hostname in ALLOWED and "/sites/default/files/" in p.path and p.path.lower().endswith(".zip"):
                      urls.append(u)
              if not urls: raise RuntimeError("vault door zip link not found")
              data=fetch(urls[0]); tmp=Path(tempfile.mkdtemp(prefix="wtg-vault-"))
              try:
                  zp=tmp/"asset.zip"; zp.write_bytes(data); unpack=tmp/"u"; unpack.mkdir()
                  with zipfile.ZipFile(zp) as z:
                      for info in z.infolist():
                          pp=PurePosixPath(info.filename)
                          if info.is_dir(): continue
                          if pp.is_absolute() or ".." in pp.parts or info.file_size>40*1024*1024: raise ValueError("unsafe archive")
                          if Path(info.filename).suffix.lower() not in {".fbx",".obj",".mtl",".png",".jpg",".jpeg",".txt"}: continue
                          out=unpack/Path(*pp.parts); out.parent.mkdir(parents=True,exist_ok=True)
                          with z.open(info) as s, open(out,"wb") as d: shutil.copyfileobj(s,d)
                  models=[p for p in unpack.rglob("*") if p.suffix.lower() in {".fbx",".obj"} and "door" in p.stem.lower()]
                  if not models: models=[p for p in unpack.rglob("*") if p.suffix.lower() in {".fbx",".obj"}]
                  if not models: raise RuntimeError("no vault model")
                  primary=sorted(models,key=lambda p:(0 if p.suffix.lower()==".fbx" else 1,len(p.as_posix())))[0]
                  target=ROOT/"SourceAssets/Models/OpenGameArt"/vid; target.mkdir(parents=True,exist_ok=True)
                  for p in unpack.rglob("*"):
                      if p.is_file():
                          out=target/p.relative_to(unpack); out.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(p,out)
                  rec={"id":vid,"name":"Vault Door","provider":"OpenGameArt","source_page":page,"license":"CC0-1.0",
                       "intended_use":"Safe/vault interaction proxy where the project still uses cube geometry.",
                       "primary_path":(target/primary.relative_to(unpack)).relative_to(ROOT).as_posix(),
                       "sources":[{"url":urls[0],"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()}]}
                  commit_asset(rec,target)
              finally:
                  shutil.rmtree(tmp,ignore_errors=True)
          PY
