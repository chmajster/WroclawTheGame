name: Validate KayKit animation completion

on:
  push:
    branches:
      - assets/kaykit-animation-completion-20260918
    paths:
      - .github/workflows/validate-kaykit-animation-completion.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: assets/kaykit-animation-completion-20260918
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify vendored source bytes
        run: |
          python Scripts/fetch_free_character_animation_assets.py --check
          python Scripts/fetch_kaykit_character_animations.py --check
      - name: Run animation and model coverage tests
        run: |
          python -m unittest Tests.test_free_character_animation_assets -v
          python -m unittest Tests.test_kaykit_character_animations -v
          python -m unittest Tests.test_free_models -v
          python -m compileall -q Scripts Tests
      - name: Remove one-shot workflow after successful validation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/validate-kaykit-animation-completion.yml
          git commit -m "ci: remove completed KayKit validation workflow"
          git push origin "HEAD:${GITHUB_REF_NAME}"
