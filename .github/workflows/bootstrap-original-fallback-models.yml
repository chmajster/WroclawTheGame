name: Add original fallback prop models

on:
  push:
    branches:
      - assets/cc0-models-20260918
    paths:
      - .github/workflows/bootstrap-original-fallback-models.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate remaining deterministic props and commit each separately
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          ROOT=Path.cwd()
          CAT=ROOT/"Data/free_external_model_catalog.json"
          catalog=json.loads(CAT.read_text(encoding="utf-8")) if CAT.exists() else []
          existing={x["id"] for x in catalog}

          def boxes_to_obj(boxes):
              vertices=[]; faces=[]
              for cx,cy,cz,sx,sy,sz in boxes:
                  base=len(vertices)+1
                  x0,x1=cx-sx/2,cx+sx/2
                  y0,y1=cy-sy/2,cy+sy/2
                  z0,z1=cz-sz/2,cz+sz/2
                  vertices += [(x0,y0,z0),(x1,y0,z0),(x1,y1,z0),(x0,y1,z0),
                               (x0,y0,z1),(x1,y0,z1),(x1,y1,z1),(x0,y1,z1)]
                  faces += [(base,base+1,base+2,base+3),(base+4,base+7,base+6,base+5),
                            (base,base+4,base+5,base+1),(base+1,base+5,base+6,base+2),
                            (base+2,base+6,base+7,base+3),(base+4,base,base+3,base+7)]
              lines=["# Original WroclawTheGame CC0 fallback mesh","o WTG_Fallback"]
              lines += [f"v {x:.4f} {y:.4f} {z:.4f}" for x,y,z in vertices]
              lines += ["f "+" ".join(map(str,f)) for f in faces]
              return "\n".join(lines)+"\n"

          models=[
            ("wtg-original-usb-flash-drive","USB Flash Drive",
             "Pendrive/evidence fallback because accessible CC0 download sources require account login.",
             [(0,0,0,4.6,1.8,.75),(3.15,0,0,1.7,1.25,.55)]),
            ("wtg-original-usb-cable","USB Cable",
             "USB cable pickup fallback.",
             [(-3,0,0,1.8,1.2,.45),(3,0,0,1.8,1.2,.45),
              (-1.8,0,0,1.0,.32,.32),(-.6,0,0,1.4,.32,.32),(.8,0,0,1.4,.32,.32),(2.0,0,0,1.0,.32,.32)]),
            ("wtg-original-wall-charger","Wall Charger",
             "Phone charger pickup fallback.",
             [(0,0,0,3.2,2.5,4.0),(0,-1.55,-.4,.45,1.25,.45),(1.0,-1.55,-.4,.45,1.25,.45)]),
            ("wtg-original-cartridge-fuse","Cartridge Fuse",
             "Fuse pickup fallback used by the apartment power puzzle.",
             [(0,0,0,3.4,1.0,1.0),(-2.0,0,0,.8,1.25,1.25),(2.0,0,0,.8,1.25,1.25)]),
            ("wtg-original-cash-bundle","Cash Bundle",
             "Cash quest-item fallback.",
             [(0,0,0,6.5,3.0,.7),(0,0,.55,6.5,3.0,.35),(0,0,.75,1.2,3.2,.25)]),
            ("wtg-original-wall-outlet","Wall Outlet",
             "Apartment outlet interaction fallback.",
             [(0,0,0,4.0,.7,4.0),(-.9,-.5,.4,.55,.35,1.0),(.9,-.5,.4,.55,.35,1.0),
              (-.9,-.5,-.9,.55,.35,.55),(.9,-.5,-.9,.55,.35,.55)]),
            ("wtg-original-intercom","Wall Intercom",
             "Intercom/password puzzle fallback.",
             [(0,0,0,5.0,1.4,8.0),(-1.2,-1.0,1.4,1.3,.4,3.6),(1.2,-1.0,1.4,1.3,.4,3.6),
              (-1.3,-1.0,-1.8,.7,.4,.7),(0,-1.0,-1.8,.7,.4,.7),(1.3,-1.0,-1.8,.7,.4,.7)]),
          ]

          for ident,name,use,boxes in models:
              if ident in existing: continue
              target=ROOT/"SourceAssets/Models/WroclawTheGame"/ident
              target.mkdir(parents=True,exist_ok=True)
              obj=target/(ident+".obj")
              obj.write_text(boxes_to_obj(boxes),encoding="utf-8")
              rec={"id":ident,"name":name,"provider":"WroclawTheGame","license":"CC0-1.0",
                   "source_page":"project://original-fallbacks","intended_use":use,
                   "primary_path":obj.relative_to(ROOT).as_posix(),"generated":True,
                   "generator":"bootstrap-original-fallback-models.yml"}
              (target/"asset.json").write_text(json.dumps(rec,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
              catalog.append(rec); CAT.write_text(json.dumps(catalog,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
              subprocess.run(["git","add",str(target.relative_to(ROOT)),str(CAT.relative_to(ROOT))],check=True)
              subprocess.run(["git","commit","-m",f"assets: add {ident} model"],check=True)
              subprocess.run(["git","push","origin",f"HEAD:{os.environ['GITHUB_REF_NAME']}"],check=True)
              existing.add(ident)
          PY
